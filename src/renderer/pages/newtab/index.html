<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Новая вкладка</title>
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="newtab.css">
  <script src="/shared/theme.js"></script>
  <script src="/shared/icons.js" defer></script>
  <script src="/shared/kui.js" defer></script>
  <script src="newtab.js" defer></script>
</head>
<body>
  <!-- Владелец: ux-chrome. Поле поиска передаёт ввод в адресную строку (как в Chrome), плитки — закладки и частые сайты. -->
  <main class="nt">
    <div class="nt-hero">
      <div class="nt-logo" id="nt-logo"></div>
      <button class="nt-search" id="nt-search" type="button" aria-label="Поиск или адрес">
        <span class="nt-search-icon" id="nt-icon"></span>
        <span class="nt-placeholder" id="nt-placeholder">Поиск или адрес</span>
      </button>
      <div class="nt-chips" id="nt-chips" aria-label="Бэнги"></div>
    </div>
    <section class="nt-section" id="nt-bar" hidden>
      <h2 class="k-label">Закладки</h2>
      <div class="nt-grid"></div>
    </section>
    <section class="nt-section" id="nt-freq" hidden>
      <h2 class="k-label">Часто посещаемые</h2>
      <div class="nt-grid"></div>
    </section>
  </main>
</body>
</html>
