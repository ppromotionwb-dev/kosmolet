<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Космолёт — инструменты</title>
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="panel.css">
  <script src="/shared/theme.js"></script>
  <script src="/shared/icons.js" defer></script>

<body>
  <div id="panel">
    <div id="resizer" title="Потяните, чтобы изменить ширину. Двойной клик — по умолчанию"></div>
    <header id="head">
      <div id="tool-tabs" role="tablist" aria-label="Инструменты"></div>
      <div id="tool-title" class="k-ellipsis"></div>
      <button id="panel-close" class="k-icon-btn" title="Закрыть панель" aria-label="Закрыть панель"></button>

    <main id="body"></main>
